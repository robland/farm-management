# Pilot deployment on one server (docs/operations/DEPLOYMENT.md).
#   docker compose -f deploy/compose.pilot.yml --env-file deploy/.env up -d --build
# Only the proxy is reachable from outside (80/443); the database and the API stay on
# the internal network.
name: fms-pilot

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off job run before the API starts: schema migrations are never applied by hand.
  migrate:
    image: fms-api:${FMS_VERSION:-latest}
    build:
      context: ../backend
    env_file: .env
    environment: &api-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_ALLOWED_HOSTS: ${FMS_DOMAIN:?},api
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${FMS_DOMAIN}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: fms-api:${FMS_VERSION:-latest}
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - files:/data/files
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/v1/health/', headers={'Host': 'api', 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: fms-web:${FMS_VERSION:-latest}
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile
    restart: unless-stopped
    environment:
      FMS_DOMAIN: ${FMS_DOMAIN}
      FMS_ACME_EMAIL: ${FMS_ACME_EMAIL:?}
    ports:
      - "${FMS_HTTP_PORT:-80}:80"
      - "${FMS_HTTPS_PORT:-443}:443"
      - "${FMS_HTTPS_PORT:-443}:443/udp"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # Daily backup: `docker compose ... run --rm backup` from the host's cron (runbook).
  backup:
    image: postgres:17
    profiles: ["ops"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_DIR: /backups
      FILES_DIR: /data/files
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["sh", "/scripts/backup_db.sh"]
    volumes:
      - ../scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - files:/data/files:ro
    depends_on:
      db:
        condition: service_healthy

  # Restoration (runbook): stop api first, then
  #   docker compose ... run --rm restore /backups/fms-<stamp>.dump /backups/fms-files-<stamp>.tar.gz
  restore:
    image: postgres:17
    profiles: ["ops"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILES_DIR: /data/files
    entrypoint: ["sh", "/scripts/restore_db.sh"]
    volumes:
      - ../scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
